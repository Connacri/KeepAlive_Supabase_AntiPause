name: Supabase KeepAlive (Ping)

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      project:
        description: 'Nom exact du projet à pinger (laisser vide pour tous les projets actifs)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  keepalive:
    name: Pinger les projets Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Exécuter les pings Supabase (INSERT / UPDATE / COUNT / DELETE)
        env:
          SUPABASE_KEY_BLOG_VITRINE: ${{ secrets.SUPABASE_KEY_BLOG_VITRINE }}
          SUPABASE_TOKEN_PERSO: ${{ secrets.SUPABASE_TOKEN_PERSO }}
          SUPABASE_KEY_CRM_CLIENT: ${{ secrets.SUPABASE_KEY_CRM_CLIENT }}
          SUPABASE_KEY_APPOINTMENT: ${{ secrets.SUPABASE_KEY_APPOINTMENT }}
          SUPABASE_TOKEN_CONNACRI3_GMAIL_COM: ${{ secrets.SUPABASE_TOKEN_CONNACRI3_GMAIL_COM }}
          SUPABASE_KEY_CYBERSCRAPE: ${{ secrets.SUPABASE_KEY_CYBERSCRAPE }}
          SUPABASE_KEY_RAMZI_GUEDOUAR_GMAIL_COM_S_PROJECT: ${{ secrets.SUPABASE_KEY_RAMZI_GUEDOUAR_GMAIL_COM_S_PROJECT }}
          SUPABASE_TOKEN_RAMZI_GUEDOUAR_GMAIL_COM: ${{ secrets.SUPABASE_TOKEN_RAMZI_GUEDOUAR_GMAIL_COM }}
          SUPABASE_KEY_CONGRESS_S_PROJECT: ${{ secrets.SUPABASE_KEY_CONGRESS_S_PROJECT }}
          SUPABASE_TOKEN_ORAN_INTURK_GMAIL_COM: ${{ secrets.SUPABASE_TOKEN_ORAN_INTURK_GMAIL_COM }}
          SUPABASE_KEY_PLANNING: ${{ secrets.SUPABASE_KEY_PLANNING }}
          SUPABASE_KEY_RND: ${{ secrets.SUPABASE_KEY_RND }}
          SUPABASE_TOKEN_SAMUEL69TR00_GMAIL_COM: ${{ secrets.SUPABASE_TOKEN_SAMUEL69TR00_GMAIL_COM }}
          SUPABASE_KEY_DORO_S_PROJECT: ${{ secrets.SUPABASE_KEY_DORO_S_PROJECT }}
          SUPABASE_KEY_PROFILUM_PROJECT: ${{ secrets.SUPABASE_KEY_PROFILUM_PROJECT }}
          SUPABASE_TOKEN_FORSLOG_GMAIL_COM: ${{ secrets.SUPABASE_TOKEN_FORSLOG_GMAIL_COM }}
          SUPABASE_KEY_FORSLOG_GMAIL_COM: ${{ secrets.SUPABASE_KEY_FORSLOG_GMAIL_COM }}
          SUPABASE_KEY_ORHOSPITAL_PLATEAU: ${{ secrets.SUPABASE_KEY_ORHOSPITAL_PLATEAU }}
          SUPABASE_TOKEN_AN_TIREX_GMAIL_COM: ${{ secrets.SUPABASE_TOKEN_AN_TIREX_GMAIL_COM }}
          SUPABASE_KEY_WIFI_PROJECT: ${{ secrets.SUPABASE_KEY_WIFI_PROJECT }}
          SUPABASE_TOKEN_ORAN_TIREX_GMAIL_COM: ${{ secrets.SUPABASE_TOKEN_ORAN_TIREX_GMAIL_COM }}
          SUPABASE_KEY_CARGOLINK: ${{ secrets.SUPABASE_KEY_CARGOLINK }}
          SUPABASE_TOKEN_CONNACRI1_GMAIL_COM: ${{ secrets.SUPABASE_TOKEN_CONNACRI1_GMAIL_COM }}
        run: |
          python3 scripts/keepalive.py ping --config projects.json --project "${{ inputs.project }}"
